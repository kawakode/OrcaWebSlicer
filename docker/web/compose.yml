name: orca-web

x-build-environment: &build-environment
  image: orca-web-build:latest
  build:
    context: ../..
    dockerfile: docker/web/Dockerfile
    args:
      BASE_IMAGE: ${ORCA_WEB_BASE_IMAGE:-ubuntu:24.04}
      CMAKE_VERSION: ${ORCA_WEB_CMAKE_VERSION:-4.3.0}
  working_dir: /workspace
  environment:
    CMAKE_BUILD_PARALLEL_LEVEL: ${ORCA_WEB_BUILD_JOBS:-2}
    CMAKE_CCACHE: ccache
    CCACHE_DIR: /cache/ccache
    CI: "true"
    DEPS_EXTRA_BUILD_ARGS: -DORCA_DEPS_SEPARATE_BUILD_FILESYSTEM=ON
    GITHUB_ACTIONS: "true"
    GITHUB_WORKSPACE: /workspace
    ORCA_WEB_GIT_COMMIT: ${ORCA_WEB_GIT_COMMIT:-}
    ORCA_WEB_GIT_DIRTY: ${ORCA_WEB_GIT_DIRTY:-}
    ORCA_SLICER_RESOURCES: /workspace/resources
    RUNNER_OS: Linux
    RUNNER_TEMP: /tmp
  volumes:
    - ../..:/workspace
    - orca-deps-build:/workspace/deps/build
    - orca-app-build:/workspace/build
    - orca-worker-build:/workspace/build-worker
    - orca-ccache:/cache/ccache

services:
  build:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        sed 's/\r$$//' docker/web/run-build-linux.sh > /tmp/run-build-linux
        && bash /tmp/run-build-linux ./build_linux.sh
        -j "$${CMAKE_BUILD_PARALLEL_LEVEL}"
        -dstrlL

  tests:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        ctest
        --test-dir build/tests
        -C Release
        --output-on-failure

  worker-build:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        cmake
        -S .
        -B build-worker
        -G "Ninja Multi-Config"
        -DCMAKE_C_COMPILER=/usr/bin/clang
        -DCMAKE_CXX_COMPILER=/usr/bin/clang++
        -DCMAKE_PREFIX_PATH=/workspace/deps/build/OrcaSlicer_dep/usr/local
        -DDEP_BUILD_DIR=/workspace/deps/build
        -DBUILD_TESTS=ON
        -DORCA_WEB_WORKER=ON
        -DSLIC3R_BUILD_SANDBOXES=OFF
        -DSLIC3R_GUI=OFF
        -DSLIC3R_STATIC=ON
        && cmake
        --build build-worker
        --config Release
        --target orca-slicer-worker libslic3r_tests
        -j "$${CMAKE_BUILD_PARALLEL_LEVEL}"

  worker-smoke:
    <<: *build-environment
    network_mode: none
    command:
      - bash
      - -lc
      - >-
        set -euo pipefail;
        worker=build-worker/src/Release/orca-slicer-worker;
        build-worker/tests/libslic3r/Release/libslic3r_tests "[WorkerManifest]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[WorkerProtocol]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[ArtifactTransaction]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[Color]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[FlushVolumes]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[SliceRequest]";
        "$${worker}" --version;
        "$${worker}" --validate-manifest tests/data/web-worker/valid-envelope.json;
        set +e;
        "$${worker}" --validate-manifest tests/data/web-worker/invalid-envelope.json;
        invalid_status=$$?;
        set -e;
        test "$${invalid_status}" -eq 4;
        oversized_manifest=$$(mktemp);
        python3 -c 'import pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(b" " * (1024 * 1024 + 1))' "$${oversized_manifest}";
        set +e;
        "$${worker}" --validate-manifest "$${oversized_manifest}";
        oversized_status=$$?;
        set -e;
        rm -f "$${oversized_manifest}";
        test "$${oversized_status}" -eq 3;
        job_dir=$$(mktemp -d);
        trap 'rm -rf "$${job_dir}"' EXIT;
        cp tests/data/20mm_cube.obj "$${job_dir}/model.obj";
        cp tests/data/web-worker/slice-envelope.json "$${job_dir}/request.json";
        printf 'abandoned\n' > "$${job_dir}/.result.gcode.single-plate-smoke.partial";
        "$${worker}" --slice-manifest "$${job_dir}/request.json" | tee "$${job_dir}/events.ndjson";
        test -s "$${job_dir}/result.gcode";
        test -s "$${job_dir}/result.json";
        test -z "$$(find "$${job_dir}" -name '*.partial' -print -quit)";
        python3 -c 'import json, pathlib, sys; events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; result=json.loads(pathlib.Path(sys.argv[2]).read_text()); progress=[event["progress"]["percent"] for event in events if event["type"] == "progress"]; assert [event["sequence"] for event in events] == list(range(len(events))); assert progress == sorted(progress); assert events[-1]["state"] == "succeeded"; assert result["outcome"] == "succeeded"; assert len(result["artifacts"][0]["sha256"]) == 64' "$${job_dir}/events.ndjson" "$${job_dir}/result.json";
        grep -q '^G1 ' "$${job_dir}/result.gcode";
        conflict_job_dir=$$(mktemp -d);
        cp tests/data/20mm_cube.obj "$${conflict_job_dir}/model.obj";
        cp tests/data/web-worker/slice-envelope.json "$${conflict_job_dir}/request.json";
        printf 'existing\n' > "$${conflict_job_dir}/result.gcode";
        set +e;
        "$${worker}" --slice-manifest "$${conflict_job_dir}/request.json" | tee "$${conflict_job_dir}/events.ndjson";
        conflict_status=$$?;
        set -e;
        test "$${conflict_status}" -eq 5;
        test "$$(cat "$${conflict_job_dir}/result.gcode")" = existing;
        test -z "$$(find "$${conflict_job_dir}" -name '*.partial' -print -quit)";
        python3 -c 'import json, pathlib, sys; events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; result=json.loads(pathlib.Path(sys.argv[2]).read_text()); assert events[-1]["state"] == "failed"; assert result["outcome"] == "failed"; assert result["error"]["category"] == "validation"; assert result["error"]["code"] == "artifact_exists"' "$${conflict_job_dir}/events.ndjson" "$${conflict_job_dir}/result.json";
        rm -rf "$${conflict_job_dir}";
        limit_job_dir=$$(mktemp -d);
        cp tests/data/20mm_cube.obj "$${limit_job_dir}/model.obj";
        cp tests/data/web-worker/output-limit-envelope.json "$${limit_job_dir}/request.json";
        set +e;
        "$${worker}" --slice-manifest "$${limit_job_dir}/request.json" | tee "$${limit_job_dir}/events.ndjson";
        limit_status=$$?;
        set -e;
        test "$${limit_status}" -eq 7;
        test ! -e "$${limit_job_dir}/result.gcode";
        test -z "$$(find "$${limit_job_dir}" -name '*.partial' -print -quit)";
        python3 -c 'import json, pathlib, sys; events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; result=json.loads(pathlib.Path(sys.argv[2]).read_text()); assert events[-1]["state"] == "failed"; assert result["outcome"] == "failed"; assert result["artifacts"] == []; assert result["error"]["category"] == "resource_limit"; assert result["error"]["code"] == "output_size_limit_exceeded"' "$${limit_job_dir}/events.ndjson" "$${limit_job_dir}/result.json";
        rm -rf "$${limit_job_dir}";
        python3 scripts/test_web_worker_cancellation.py
        --worker "$${worker}"
        --model tests/data/20mm_cube.obj;
        profile_job_dir=$$(mktemp -d);
        cp tests/data/20mm_cube.obj "$${profile_job_dir}/model.obj";
        cp tests/data/web-worker/profile-slice-envelope.json "$${profile_job_dir}/request.json";
        python3 scripts/materialize_web_profiles.py
        --output "$${profile_job_dir}/profiles"
        --machine "resources/profiles/Anycubic/machine/Anycubic Kobra 0.4 nozzle.json"
        --process "resources/profiles/Anycubic/process/0.20mm Standard @Anycubic Kobra.json"
        --filament "resources/profiles/Anycubic/filament/Anycubic Generic PLA.json";
        "$${worker}" --slice-manifest "$${profile_job_dir}/request.json";
        test -s "$${profile_job_dir}/result.gcode";
        test -s "$${profile_job_dir}/result.json";
        grep -q '^G1 ' "$${profile_job_dir}/result.gcode";
        rm -rf "$${profile_job_dir}";
        python3 scripts/check_web_worker_deps.py "$${worker}"

  worker-baseline:
    <<: *build-environment
    network_mode: none
    command:
      - python3
      - scripts/web_worker_baseline.py
      - --manifest
      - docs/web/baseline-cases.json
      - --worker
      - build-worker/src/Release/orca-slicer-worker
      - --native-baselines
      - build/web-baseline

  baseline:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        python3 scripts/web_baseline.py
        --manifest docs/web/baseline-cases.json
        --slicer build/package/bin/orca-slicer
        --output build/web-baseline

volumes:
  orca-deps-build:
  orca-app-build:
  orca-worker-build:
  orca-ccache:
