name: orca-web

x-build-environment: &build-environment
  image: orca-web-build:latest
  build:
    context: ../..
    dockerfile: docker/web/Dockerfile
    args:
      BASE_IMAGE: ${ORCA_WEB_BASE_IMAGE:-ubuntu:24.04}
      CMAKE_VERSION: ${ORCA_WEB_CMAKE_VERSION:-4.3.0}
  working_dir: /workspace
  environment:
    CMAKE_BUILD_PARALLEL_LEVEL: ${ORCA_WEB_BUILD_JOBS:-2}
    CMAKE_CCACHE: ccache
    CCACHE_DIR: /cache/ccache
    CI: "true"
    DEPS_EXTRA_BUILD_ARGS: -DORCA_DEPS_SEPARATE_BUILD_FILESYSTEM=ON
    GITHUB_ACTIONS: "true"
    GITHUB_WORKSPACE: /workspace
    ORCA_WEB_GIT_COMMIT: ${ORCA_WEB_GIT_COMMIT:-}
    ORCA_WEB_GIT_DIRTY: ${ORCA_WEB_GIT_DIRTY:-}
    ORCA_WEB_MAX_CPU_TIME_MS: ${ORCA_WEB_MAX_CPU_TIME_MS:-300000}
    ORCA_WEB_MAX_INPUT_BYTES: ${ORCA_WEB_MAX_INPUT_BYTES:-262144000}
    ORCA_WEB_MAX_TOTAL_INPUT_BYTES: ${ORCA_WEB_MAX_TOTAL_INPUT_BYTES:-536870912}
    ORCA_WEB_MAX_JOB_INPUTS: ${ORCA_WEB_MAX_JOB_INPUTS:-16}
    ORCA_WEB_JOB_RETENTION_SECONDS: ${ORCA_WEB_JOB_RETENTION_SECONDS:-86400}
    ORCA_WEB_API_URL: ${ORCA_WEB_API_URL:-http://api:8000}
    ORCA_WEB_MAX_CONCURRENT_JOBS: ${ORCA_WEB_MAX_CONCURRENT_JOBS:-2}
    ORCA_WEB_PROFILE_VENDORS: ${ORCA_WEB_PROFILE_VENDORS:-Anycubic}
    ORCA_WEB_STATE_ROOT: ${ORCA_WEB_STATE_ROOT:-/workspace/build/web-state}
    ORCA_WEB_WORKER: ${ORCA_WEB_WORKER:-/workspace/build-worker/src/Release/orca-slicer-worker}
    ORCA_WEB_MAX_MEMORY_BYTES: ${ORCA_WEB_MAX_MEMORY_BYTES:-4294967296}
    ORCA_WEB_MAX_OUTPUT_BYTES: ${ORCA_WEB_MAX_OUTPUT_BYTES:-1073741824}
    ORCA_WEB_MAX_PREVIEW_BYTES: ${ORCA_WEB_MAX_PREVIEW_BYTES:-268435456}
    ORCA_WEB_MAX_EVENT_BYTES: ${ORCA_WEB_MAX_EVENT_BYTES:-1048576}
    ORCA_WEB_MAX_EXTRACTED_BYTES: ${ORCA_WEB_MAX_EXTRACTED_BYTES:-1073741824}
    ORCA_WEB_MAX_EVENT_LINE_BYTES: ${ORCA_WEB_MAX_EVENT_LINE_BYTES:-65536}
    ORCA_WEB_MAX_EVENTS: ${ORCA_WEB_MAX_EVENTS:-4096}
    ORCA_WEB_MAX_LOG_BYTES: ${ORCA_WEB_MAX_LOG_BYTES:-1048576}
    ORCA_WEB_MAX_OPEN_FILES: ${ORCA_WEB_MAX_OPEN_FILES:-128}
    ORCA_WEB_MAX_PROCESSES: ${ORCA_WEB_MAX_PROCESSES:-64}
    ORCA_WEB_MAX_TRIANGLES: ${ORCA_WEB_MAX_TRIANGLES:-1000000}
    ORCA_WEB_MAX_WALL_TIME_MS: ${ORCA_WEB_MAX_WALL_TIME_MS:-300000}
    ORCA_WEB_TERMINATION_GRACE_MS: ${ORCA_WEB_TERMINATION_GRACE_MS:-5000}
    ORCA_SLICER_RESOURCES: /workspace/resources
    PLAYWRIGHT_BROWSERS_PATH: /cache/playwright
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPATH: /workspace
    RUNNER_OS: Linux
    RUNNER_TEMP: /tmp
  volumes:
    - ../..:/workspace
    - orca-deps-build:/workspace/deps/build
    - orca-app-build:/workspace/build
    - orca-worker-build:/workspace/build-worker
    - orca-ccache:/cache/ccache
    # Named volumes keep npm and Playwright off the host bind mount, which is
    # where their many small files would otherwise be unusably slow.
    - orca-frontend-modules:/workspace/web/frontend/node_modules
    - orca-playwright:/cache/playwright

services:
  build:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        sed 's/\r$$//' docker/web/run-build-linux.sh > /tmp/run-build-linux
        && bash /tmp/run-build-linux ./build_linux.sh
        -j "$${CMAKE_BUILD_PARALLEL_LEVEL}"
        -dstrlL

  tests:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        ctest
        --test-dir build/tests
        -C Release
        --output-on-failure

  worker-build:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        cmake
        -S .
        -B build-worker
        -G "Ninja Multi-Config"
        -DCMAKE_C_COMPILER=/usr/bin/clang
        -DCMAKE_CXX_COMPILER=/usr/bin/clang++
        -DCMAKE_PREFIX_PATH=/workspace/deps/build/OrcaSlicer_dep/usr/local
        -DDEP_BUILD_DIR=/workspace/deps/build
        -DBUILD_TESTS=ON
        -DORCA_WEB_WORKER=ON
        -DSLIC3R_BUILD_SANDBOXES=OFF
        -DSLIC3R_GUI=OFF
        -DSLIC3R_STATIC=ON
        && cmake
        --build build-worker
        --config Release
        --target orca-slicer-worker libslic3r_tests
        -j "$${CMAKE_BUILD_PARALLEL_LEVEL}"

  worker-smoke:
    <<: *build-environment
    network_mode: none
    command:
      - bash
      - -lc
      - >-
        set -euo pipefail;
        worker=build-worker/src/Release/orca-slicer-worker;
        build-worker/tests/libslic3r/Release/libslic3r_tests "[WorkerManifest]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[WorkerProtocol]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[ArtifactTransaction]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[Color]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[FlushVolumes]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[SliceRequest]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[ProjectArchive]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[SettingsCatalog]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[ProfileCompatibility]";
        build-worker/tests/libslic3r/Release/libslic3r_tests "[SceneExport]";
        "$${worker}" --version;
        "$${worker}" --validate-manifest tests/data/web-worker/valid-envelope.json;
        set +e;
        "$${worker}" --validate-manifest tests/data/web-worker/invalid-envelope.json;
        invalid_status=$$?;
        set -e;
        test "$${invalid_status}" -eq 4;
        oversized_manifest=$$(mktemp);
        python3 -c 'import pathlib, sys; pathlib.Path(sys.argv[1]).write_bytes(b" " * (1024 * 1024 + 1))' "$${oversized_manifest}";
        set +e;
        "$${worker}" --validate-manifest "$${oversized_manifest}";
        oversized_status=$$?;
        set -e;
        rm -f "$${oversized_manifest}";
        test "$${oversized_status}" -eq 3;
        "$${worker}" --export-settings-catalog > /tmp/settings-catalog.json;
        python3 -c 'import json, pathlib, sys; catalog=json.loads(pathlib.Path(sys.argv[1]).read_text()); groups={group["id"] for group in catalog["groups"]}; assert catalog["catalog_version"] == 1; assert catalog["settings"]; assert all(not setting.get("missing") for setting in catalog["settings"]); assert all(setting["group"] in groups for setting in catalog["settings"]); layer=[setting for setting in catalog["settings"] if setting["key"] == "layer_height"][0]; assert layer["type"] == "float"; assert layer["scope"] == "process"; assert layer["unit"] == "mm"; assert layer["default"]' /tmp/settings-catalog.json;
        compatibility_dir=$$(mktemp -d);
        mkdir -p "$${compatibility_dir}/printers";
        python3 scripts/materialize_web_profiles.py
        --output "$${compatibility_dir}/staged"
        --machine "resources/profiles/Anycubic/machine/Anycubic Kobra 0.4 nozzle.json"
        --process "resources/profiles/Anycubic/process/0.20mm Standard @Anycubic Kobra.json"
        --filament "resources/profiles/Anycubic/filament/Anycubic Generic PLA.json";
        cp "$${compatibility_dir}/staged/machine.json" "$${compatibility_dir}/printers/0.json";
        python3 -c 'import json, pathlib, sys; pathlib.Path(sys.argv[1]).write_text(json.dumps({"catalog_version": 1, "printers": [{"id": "kobra", "name": "Anycubic Kobra 0.4 nozzle", "profile": "printers/0.json"}], "candidates": [{"id": "matching", "condition": "printer_preset =~ /.*Kobra.*/"}, {"id": "other", "condition": "printer_preset =~ /.*Nonexistent.*/"}]}))' "$${compatibility_dir}/request.json";
        "$${worker}" --evaluate-compatibility "$${compatibility_dir}/request.json" > "$${compatibility_dir}/response.json";
        python3 -c 'import json, pathlib, sys; answered=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert answered["compatibility"]["matching"] == ["kobra"]; assert answered["compatibility"]["other"] == []; assert answered["unevaluated"] == []' "$${compatibility_dir}/response.json";
        rm -rf "$${compatibility_dir}";
        python3 scripts/test_web_scene.py
        --worker "$${worker}"
        --model tests/data/20mm_cube.obj;
        job_dir=$$(mktemp -d);
        trap 'rm -rf "$${job_dir}"' EXIT;
        cp tests/data/20mm_cube.obj "$${job_dir}/model.obj";
        cp tests/data/web-worker/slice-envelope.json "$${job_dir}/request.json";
        printf 'abandoned\n' > "$${job_dir}/.result.gcode.single-plate-smoke.partial";
        "$${worker}" --slice-manifest "$${job_dir}/request.json" | tee "$${job_dir}/events.ndjson";
        test -s "$${job_dir}/result.gcode";
        test -s "$${job_dir}/result.json";
        test -z "$$(find "$${job_dir}" -name '*.partial' -print -quit)";
        python3 -c 'import json, pathlib, sys; events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; result=json.loads(pathlib.Path(sys.argv[2]).read_text()); progress=[event["progress"]["percent"] for event in events if event["type"] == "progress"]; assert [event["sequence"] for event in events] == list(range(len(events))); assert progress == sorted(progress); assert events[-1]["state"] == "succeeded"; assert result["outcome"] == "succeeded"; assert len(result["artifacts"][0]["sha256"]) == 64' "$${job_dir}/events.ndjson" "$${job_dir}/result.json";
        grep -q '^G1 ' "$${job_dir}/result.gcode";
        conflict_job_dir=$$(mktemp -d);
        cp tests/data/20mm_cube.obj "$${conflict_job_dir}/model.obj";
        cp tests/data/web-worker/slice-envelope.json "$${conflict_job_dir}/request.json";
        printf 'existing\n' > "$${conflict_job_dir}/result.gcode";
        set +e;
        "$${worker}" --slice-manifest "$${conflict_job_dir}/request.json" | tee "$${conflict_job_dir}/events.ndjson";
        conflict_status=$$?;
        set -e;
        test "$${conflict_status}" -eq 5;
        test "$$(cat "$${conflict_job_dir}/result.gcode")" = existing;
        test -z "$$(find "$${conflict_job_dir}" -name '*.partial' -print -quit)";
        python3 -c 'import json, pathlib, sys; events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; result=json.loads(pathlib.Path(sys.argv[2]).read_text()); assert events[-1]["state"] == "failed"; assert result["outcome"] == "failed"; assert result["error"]["category"] == "validation"; assert result["error"]["code"] == "artifact_exists"' "$${conflict_job_dir}/events.ndjson" "$${conflict_job_dir}/result.json";
        rm -rf "$${conflict_job_dir}";
        limit_job_dir=$$(mktemp -d);
        cp tests/data/20mm_cube.obj "$${limit_job_dir}/model.obj";
        cp tests/data/web-worker/output-limit-envelope.json "$${limit_job_dir}/request.json";
        set +e;
        "$${worker}" --slice-manifest "$${limit_job_dir}/request.json" | tee "$${limit_job_dir}/events.ndjson";
        limit_status=$$?;
        set -e;
        test "$${limit_status}" -eq 7;
        test ! -e "$${limit_job_dir}/result.gcode";
        test -z "$$(find "$${limit_job_dir}" -name '*.partial' -print -quit)";
        python3 -c 'import json, pathlib, sys; events=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]; result=json.loads(pathlib.Path(sys.argv[2]).read_text()); assert events[-1]["state"] == "failed"; assert result["outcome"] == "failed"; assert result["artifacts"] == []; assert result["error"]["category"] == "resource_limit"; assert result["error"]["code"] == "output_size_limit_exceeded"' "$${limit_job_dir}/events.ndjson" "$${limit_job_dir}/result.json";
        rm -rf "$${limit_job_dir}";
        project_job_dir=$$(mktemp -d);
        cp "tests/data/test_3mf/Geräte/Büchse.3mf" "$${project_job_dir}/project.3mf";
        cp tests/data/web-worker/project-slice-envelope.json "$${project_job_dir}/request.json";
        "$${worker}" --slice-manifest "$${project_job_dir}/request.json" | tee "$${project_job_dir}/events.ndjson";
        test -s "$${project_job_dir}/result.gcode";
        test -z "$$(find "$${project_job_dir}" -name '*.partial' -print -quit)";
        grep -q '^G1 ' "$${project_job_dir}/result.gcode";
        python3 -c 'import json, pathlib, sys; result=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert result["outcome"] == "succeeded"; assert result["artifacts"][0]["path"] == "result.gcode"' "$${project_job_dir}/result.json";
        rm -rf "$${project_job_dir}";
        bomb_job_dir=$$(mktemp -d);
        python3 -c 'import sys, zipfile; archive=zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED); [archive.writestr("Metadata/entry_%d.json" % index, bytes(512 * 1024)) for index in range(4)]; archive.close()' "$${bomb_job_dir}/project.3mf";
        cp tests/data/web-worker/project-extraction-limit-envelope.json "$${bomb_job_dir}/request.json";
        set +e;
        "$${worker}" --slice-manifest "$${bomb_job_dir}/request.json" | tee "$${bomb_job_dir}/events.ndjson";
        bomb_status=$$?;
        set -e;
        test "$${bomb_status}" -eq 7;
        test ! -e "$${bomb_job_dir}/result.gcode";
        python3 -c 'import json, pathlib, sys; result=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert result["outcome"] == "failed"; assert result["artifacts"] == []; assert result["error"]["category"] == "resource_limit"; assert result["error"]["code"] == "archive_extracted_size_limit_exceeded"' "$${bomb_job_dir}/result.json";
        rm -rf "$${bomb_job_dir}";
        multi_plate_job_dir=$$(mktemp -d);
        python3 -c 'import shutil, sys, zipfile; shutil.copyfile(sys.argv[1], sys.argv[2]); archive=zipfile.ZipFile(sys.argv[2], "a"); archive.writestr("Metadata/model_settings.config", "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<config>\n  <plate>\n    <metadata key=\"plater_id\" value=\"1\"/>\n  </plate>\n  <plate>\n    <metadata key=\"plater_id\" value=\"2\"/>\n  </plate>\n</config>\n"); archive.close()' "tests/data/test_3mf/Geräte/Büchse.3mf" "$${multi_plate_job_dir}/project.3mf";
        cp tests/data/web-worker/project-slice-envelope.json "$${multi_plate_job_dir}/request.json";
        set +e;
        "$${worker}" --slice-manifest "$${multi_plate_job_dir}/request.json" | tee "$${multi_plate_job_dir}/events.ndjson";
        multi_plate_status=$$?;
        set -e;
        test "$${multi_plate_status}" -eq 5;
        test ! -e "$${multi_plate_job_dir}/result.gcode";
        python3 -c 'import json, pathlib, sys; result=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert result["outcome"] == "failed"; assert result["artifacts"] == []; assert result["error"]["category"] == "input"; assert result["error"]["code"] == "multi_plate_project_unsupported"' "$${multi_plate_job_dir}/result.json";
        rm -rf "$${multi_plate_job_dir}";
        escape_job_dir=$$(mktemp -d);
        python3 -c 'import sys, zipfile; archive=zipfile.ZipFile(sys.argv[1], "w"); archive.writestr("3D/3dmodel.model", "<model/>"); archive.writestr("../escaped.config", "escaped"); archive.close()' "$${escape_job_dir}/project.3mf";
        cp tests/data/web-worker/project-slice-envelope.json "$${escape_job_dir}/request.json";
        set +e;
        "$${worker}" --slice-manifest "$${escape_job_dir}/request.json" | tee "$${escape_job_dir}/events.ndjson";
        escape_status=$$?;
        set -e;
        test "$${escape_status}" -eq 5;
        test ! -e "$${escape_job_dir}/result.gcode";
        test ! -e "$${escape_job_dir}/escaped.config";
        test ! -e "$${escape_job_dir}/../escaped.config";
        python3 -c 'import json, pathlib, sys; result=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert result["outcome"] == "failed"; assert result["error"]["category"] == "input"; assert result["error"]["code"] == "archive_entry_unsafe"' "$${escape_job_dir}/result.json";
        rm -rf "$${escape_job_dir}";
        python3 scripts/test_web_worker_cancellation.py
        --worker "$${worker}"
        --model tests/data/20mm_cube.obj;
        python3 scripts/test_web_worker_limits.py
        --worker "$${worker}"
        --model tests/data/20mm_cube.obj;
        profile_job_dir=$$(mktemp -d);
        cp tests/data/20mm_cube.obj "$${profile_job_dir}/model.obj";
        cp tests/data/web-worker/profile-slice-envelope.json "$${profile_job_dir}/request.json";
        python3 scripts/materialize_web_profiles.py
        --output "$${profile_job_dir}/profiles"
        --machine "resources/profiles/Anycubic/machine/Anycubic Kobra 0.4 nozzle.json"
        --process "resources/profiles/Anycubic/process/0.20mm Standard @Anycubic Kobra.json"
        --filament "resources/profiles/Anycubic/filament/Anycubic Generic PLA.json";
        "$${worker}" --slice-manifest "$${profile_job_dir}/request.json";
        test -s "$${profile_job_dir}/result.gcode";
        test -s "$${profile_job_dir}/result.json";
        grep -q '^G1 ' "$${profile_job_dir}/result.gcode";
        rm -rf "$${profile_job_dir}";
        python3 scripts/test_web_preview.py
        --worker "$${worker}"
        --model tests/data/20mm_cube.obj;
        python3 scripts/check_web_worker_deps.py "$${worker}"

  worker-baseline:
    <<: *build-environment
    network_mode: none
    command:
      - python3
      - scripts/web_worker_baseline.py
      - --manifest
      - docs/web/baseline-cases.json
      - --worker
      - build-worker/src/Release/orca-slicer-worker
      - --native-baselines
      - build/web-baseline

  executor-smoke:
    <<: *build-environment
    network_mode: none
    init: true
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - bash
      - -lc
      - >-
        python3 -m unittest discover -s tests/web -p 'test_*.py' -v
        && python3 scripts/test_web_worker_executor.py
        --worker build-worker/src/Release/orca-slicer-worker
        --model tests/data/20mm_cube.obj

  api:
    <<: *build-environment
    ports:
      - "${ORCA_WEB_API_PORT:-8000}:8000"
    command:
      - python3
      - -m
      - uvicorn
      - web.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  api-baseline:
    <<: *build-environment
    network_mode: none
    command:
      - python3
      - scripts/test_web_api_baseline.py
      - --manifest
      - docs/web/baseline-cases.json
      - --worker
      - build-worker/src/Release/orca-slicer-worker
      - --native-baselines
      - build/web-baseline

  frontend-build:
    <<: *build-environment
    working_dir: /workspace/web/frontend
    command:
      - bash
      - -lc
      - >-
        npm ci --no-audit --no-fund
        && npm run build

  frontend:
    <<: *build-environment
    working_dir: /workspace/web/frontend
    ports:
      - "${ORCA_WEB_FRONTEND_PORT:-5173}:5173"
    command:
      - bash
      - -lc
      - >-
        npm ci --no-audit --no-fund
        && npm run dev

  frontend-e2e:
    <<: *build-environment
    working_dir: /workspace/web/frontend
    # Playwright needs its browsers and their system libraries; the cache volume
    # keeps that download out of every later run. Chrome, Edge, and Firefox are
    # release-blocking per docs/web/mvp.md, so a failure in any of them fails
    # this service; WebKit stands in for Safari and is reported but not fatal.
    command:
      - bash
      - -lc
      - >-
        npm ci --no-audit --no-fund
        && npm run build
        && npx playwright install --with-deps chromium firefox msedge webkit
        && npm run e2e:all

  baseline:
    <<: *build-environment
    command:
      - bash
      - -lc
      - >-
        python3 scripts/web_baseline.py
        --manifest docs/web/baseline-cases.json
        --slicer build/package/bin/orca-slicer
        --output build/web-baseline

volumes:
  orca-deps-build:
  orca-app-build:
  orca-worker-build:
  orca-ccache:
  orca-frontend-modules:
  orca-playwright:
